# Cyber desktop: the terminal as a neon readout. Cyan-blue text on dark glass.
# Only used while Cyber is the desktop: kitty.conf includes
# ~/.local/state/hypr-setup/kitty-desktop.conf after end-4's generated theme, and desktop.sh points
# that file here (Cyber) or at nothing (end-4/pC keeps its wallpaper colours).
# After editing: pkill -USR1 -x kitty   (colours apply at once; the transparency needs a new kitty)

foreground              #7fd6ff
background              #030810
# see-through: Hyprland blurs what is behind (the frosted glass), the text stays at full brightness
background_opacity      0.5

cursor                  #3cf0ff
cursor_text_color       #030810
selection_foreground    #030810
selection_background    #3cf0ff
url_color               #3cf0ff

# black / bright black
color0                  #0b1622
color8                  #3d6078
# red
color1                  #ff3d6e
color9                  #ff7a9a
# green
color2                  #3dff9e
color10                 #8affc4
# yellow
color3                  #f3e600
color11                 #fff36b
# blue
color4                  #2f9bff
color12                 #7cc4ff
# magenta
color5                  #ff2bd6
color13                 #ff84e8
# cyan
color6                  #3cf0ff
color14                 #9df7ff
# white / bright white: headings and bold output read as bright cyan-white, not grey
color7                  #9bd3ee
color15                 #c9f4ff

# end-4's theme also sets a few high colours for its prompt (warm tones from the wallpaper):
# the same slots in Cyber's colours
color255                #9df7ff
color254                #0d2a3a
color253                #9bd3ee
color252                #0a1a26
color251                #f3e600
color250                #a89a00
color249                #ff7a9a
color248                #93001f
color232                #0b2030
color233                #c9f4ff
color234                #10202c
color235                #c9f4ff
