<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="viz" aria-hidden="true"></canvas>

  <header class="top">
    <div class="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <div class="system">
      <span id="host"></span>
      <button class="icon" data-power="suspend" data-tip="Click again to sleep" aria-label="Sleep">
        <svg viewBox="0 0 24 24" class="stroke"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon" data-power="reboot" data-tip="Click again to restart" aria-label="Restart">
        <svg viewBox="0 0 24 24" class="stroke"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4.5v4.8h-4.8"/></svg>
      </button>
      <button class="icon" data-power="poweroff" data-tip="Click again to shut down" aria-label="Shut down">
        <svg viewBox="0 0 24 24" class="stroke"><path d="M12 3.5v8"/><path d="M6.4 7a8 8 0 1 0 11.2 0"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="player" aria-label="Music player">
      <div class="art-wrap">
        <div class="vinyl" aria-hidden="true"><div class="disc"></div><div class="sheen"></div></div>
        <div class="art"><canvas id="cover"></canvas><img id="coverImg" alt="" hidden></div>
      </div>
      <div class="meta">
        <div class="eyebrow">Now playing</div>
        <h1 id="title">Aurora</h1>
        <div id="artist"></div>
        <div class="progress">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="duration"></span>
        </div>
        <div class="transport">
          <button class="icon" id="prev" aria-label="Previous track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.2v11.6a.8.8 0 0 1-1.2.7l-8.6-5.8a.8.8 0 0 1 0-1.4l8.6-5.8a.8.8 0 0 1 1.2.7z"/><rect x="5" y="5.5" width="2.6" height="13" rx="1"/></svg>
          </button>
          <button class="play" id="play" aria-label="Play or pause">
            <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>
          </button>
          <button class="icon" id="next" aria-label="Next track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 6.2v11.6a.8.8 0 0 0 1.2.7l8.6-5.8a.8.8 0 0 0 0-1.4L6.2 5.5a.8.8 0 0 0-1.2.7z"/><rect x="16.4" y="5.5" width="2.6" height="13" rx="1"/></svg>
          </button>
          <label class="volume">
            <svg viewBox="0 0 24 24"><path d="M4 9.5h3.4L12 5.6v12.8l-4.6-3.9H4z" fill="currentColor"/><path class="stroke" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.7a7.5 7.5 0 0 1 0 10.6"/></svg>
            <input id="volume" type="range" min="0" max="100" value="60" aria-label="Volume">
          </label>
        </div>
      </div>
    </section>

    <aside class="queue" id="card" aria-label="Log in">
      <div class="eyebrow">Choose environment</div>
      <ol class="envs" id="envs" role="listbox" aria-label="Environment"></ol>
      <div class="divider"></div>
      <div class="user">
        <div class="avatar" id="avatar"></div>
        <div class="who">
          <div id="realName"></div>
          <button class="link" id="switchUser" hidden>Switch user</button>
        </div>
      </div>
      <form id="login" autocomplete="off">
        <input id="password" type="password" placeholder="Password" aria-label="Password" spellcheck="false">
        <button class="go" type="submit" id="go" aria-label="Log in">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
      </form>
      <div class="status" id="status" role="status"></div>
      <div class="hint"><kbd>↑</kbd> <kbd>↓</kbd> environment · <kbd>Enter</kbd> start · <kbd>Space</kbd> play/pause<span class="caps-badge">CAPS LOCK</span></div>
    </aside>
  </main>

  <div class="demo-badge">DEMO MODE · PASSWORD "demo"</div>
  <audio id="audio" preload="auto"></audio>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
